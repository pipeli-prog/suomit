<style>
/* Splash: painted by the browser at once, with no file to wait for. iPhone (WebKit) shows nothing at all until a page
   has a picture or ~200 characters on screen, so the logo is an inline image. The stylesheets below load without
   blocking this; js/app.js waits for them before drawing the app. */
html,body{background:#060b18;margin:0}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;background:#060b18;transition:opacity .25s}
.splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 12px 40px rgb(0 0 0/.45)}
.splash b{font:700 1.9rem ui-rounded,system-ui,-apple-system,sans-serif;letter-spacing:-.03em;color:#f3f6fc}.splash b span{color:#0a84ff}
.splash i{display:block;width:120px;height:4px;border-radius:4px;background:rgb(255 255 255/.12);overflow:hidden}
.splash i:after{content:"";display:block;width:40%;height:100%;border-radius:4px;background:#0a84ff;animation:sp 1s ease-in-out infinite alternate}
@keyframes sp{from{transform:translateX(-10%)}to{transform:translateX(160%)}}
.splash.gone{opacity:0;pointer-events:none}
</style>
